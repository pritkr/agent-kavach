name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Linux is the platform the v3 executor hardening actually runs on, so this
      # job is where exec_linux_test.go (seccomp, cgroups, the re-exec helper)
      # really executes rather than only being vetted.
      - run: cd daemon && go test ./...
      # The daemon shares run state between handler and worker goroutines.
      - run: cd daemon && go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The runtime is stdlib-only, but the suites need a runner and nothing
      # installed one: this job used to die with "No module named pytest" while
      # every developer's machine already had it, because the repo shipped no
      # dependency manifest at all. requirements-dev.txt is that manifest.
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q mcp eval

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runner/package-lock.json
      # `npm test` builds first and then points --test at a glob. Do not
      # "simplify" the glob to a bare directory: on Node 22 a positional --test
      # argument is a *file or glob pattern*, not a directory to recurse into, so
      # `node --test dist/tests` is handed to the module loader and dies with
      # "Cannot find module .../dist/tests". Node 24+ recurses, which is why a
      # developer's newer local node never saw it.
      - run: cd runner && npm ci && npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, python, node, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-kavach:ci .
